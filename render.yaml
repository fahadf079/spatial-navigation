# Render Blueprint for the Spatial Navigation backend (New > Blueprint, pick this repository).
# Read the "Deploying to Render" section of the README first: this runs the camera pipeline in the cloud.
services:
  - type: web
    name: spatial-navigation
    runtime: python
    plan: standard              # 2 GB RAM. YOLO + PyTorch will not fit the 512 MB plan. Check Render's pricing page.
    buildCommand: bash render-build.sh
    startCommand: python api.py --server
    healthCheckPath: /health
    autoDeploy: false           # deploy by hand, so a push cannot break a pilot that is being tested
    disk:                       # keeps the maps and saved objects across deploys (paid plans only)
      name: sn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ACCESS_KEY         # generated by Render: copy it from the Environment page, it is never printed
        generateValue: true
      - key: ALLOWED_ORIGINS    # the address of your frontend, e.g. https://my-frontend.onrender.com (comma-separated)
        sync: false
      - key: SN_DATA_DIR
        value: /var/data
      - key: SN_DISABLE_FACES   # the boss decided faces stay on the local computer; remove only with his OK
        value: "1"
